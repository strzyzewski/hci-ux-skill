<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 20px; }
  .order { display: flex; align-items: center; justify-content: space-between;
           padding: 10px 0; border-bottom: 1px solid #ddd; }
  .order .meta { display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .status-open    { background: #2e7d32; }
  .status-delayed { background: #f9a825; }
  .status-failed  { background: #c62828; }
  .row-actions { visibility: hidden; display: flex; gap: 4px; }
  .order:hover .row-actions { visibility: visible; }
  .icon-btn { width: 20px; height: 20px; padding: 0; border: none; background: none; cursor: pointer; }
  form label { display: block; margin-top: 10px; font-size: 14px; }
  form input, form textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 16px; }
  .btn { margin-top: 14px; padding: 10px 16px; font-size: 16px; }
  #msg { margin-top: 10px; }
</style>
</head>
<body>
  <h1>My Orders</h1>

  <div id="orders">
    <div class="order" data-id="1042">
      <div class="meta"><span class="status-dot status-open"></span><span>#1042 · Desk lamp</span></div>
      <div class="row-actions">
        <button class="icon-btn" title="Edit" onclick="editOrder(1042)">✎</button>
        <button class="icon-btn" title="Cancel order" onclick="cancelOrder(1042)">🗑</button>
      </div>
    </div>
    <div class="order" data-id="1043">
      <div class="meta"><span class="status-dot status-delayed"></span><span>#1043 · Office chair</span></div>
      <div class="row-actions">
        <button class="icon-btn" title="Edit" onclick="editOrder(1043)">✎</button>
        <button class="icon-btn" title="Cancel order" onclick="cancelOrder(1043)">🗑</button>
      </div>
    </div>
    <div class="order" data-id="1044">
      <div class="meta"><span class="status-dot status-failed"></span><span>#1044 · Monitor arm</span></div>
      <div class="row-actions">
        <button class="icon-btn" title="Edit" onclick="editOrder(1044)">✎</button>
        <button class="icon-btn" title="Cancel order" onclick="cancelOrder(1044)">🗑</button>
      </div>
    </div>
  </div>

  <h2>Delivery address</h2>
  <form id="address-form">
    <label for="street">Street and number</label>
    <input id="street" name="street" autocomplete="street-address">
    <label for="zip">Postcode</label>
    <input id="zip" name="zip" autocomplete="postal-code">
    <label for="city">City</label>
    <input id="city" name="city" autocomplete="address-level2">
    <label for="note">Note for the courier</label>
    <textarea id="note" name="note" rows="3"></textarea>
    <button class="btn" type="submit">Save address</button>
  </form>
  <div id="msg"></div>

<script>
  const form = document.getElementById('address-form');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!confirm('Are you sure you want to save your address?')) return;
    try {
      const res = await fetch('/api/address', { method: 'PUT', body: new FormData(form) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      msg.textContent = 'Address saved.';
    } catch (err) {
      form.reset();
      msg.textContent = 'Error: ' + err.message;
    }
  });

  function editOrder(id) { location.href = '/orders/' + id + '/edit'; }
  async function cancelOrder(id) {
    await fetch('/api/orders/' + id, { method: 'DELETE' });
    document.querySelector('[data-id="' + id + '"]').remove();
  }
</script>
</body>
</html>
